<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" width="1600" height="1000">
  <defs>
    <filter id="fluid" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0016 0.0035" numOctaves="4" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="260" xChannelSelector="R" yChannelSelector="G" result="disp"/>
      <feGaussianBlur in="disp" stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <radialGradient id="gMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2fa0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff2fa0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#25e0e8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#25e0e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gLime" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a9f52c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a9f52c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffab29" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffab29" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6a2bff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6a2bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120c1c"/>
      <stop offset="100%" stop-color="#08060f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#gBase)"/>

  <g filter="url(#fluid)">
    <ellipse cx="380" cy="640" rx="520" ry="380" fill="url(#gMagenta)"/>
    <ellipse cx="1180" cy="330" rx="560" ry="400" fill="url(#gViolet)"/>
    <ellipse cx="900" cy="760" rx="480" ry="330" fill="url(#gCyan)"/>
    <ellipse cx="1420" cy="880" rx="420" ry="300" fill="url(#gLime)"/>
    <ellipse cx="640" cy="180" rx="420" ry="280" fill="url(#gAmber)"/>
    <ellipse cx="200" cy="120" rx="300" ry="240" fill="url(#gViolet)"/>
  </g>

  <g filter="url(#soft)" opacity="0.55">
    <ellipse cx="760" cy="500" rx="360" ry="240" fill="url(#gMagenta)"/>
    <ellipse cx="1300" cy="620" rx="300" ry="220" fill="url(#gCyan)"/>
  </g>

  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.08" style="mix-blend-mode:overlay"/>
</svg>
